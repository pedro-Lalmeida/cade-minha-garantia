<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Erro no Sistema - Cadê Minha Garantia?</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              DEFAULT: '#174C3C',
              hover: '#123B2E',
              light: '#E7F1EA',
            },
            canvas: '#F7F5EF',
            ink: {
              DEFAULT: '#303832',
              muted: '#788078',
              border: '#E2E6E2',
            },
            danger: {
              DEFAULT: '#DC2626',
              light: '#FEE2E2',
            }
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>
</head>
<body class="bg-canvas text-ink font-sans min-h-screen flex flex-col justify-between items-center p-6 selection:bg-brand-light selection:text-brand">

  <div class="w-full flex justify-center pt-8 pb-4">
    <div class="flex items-center gap-2.5">
      <div class="w-9 h-9 rounded-lg bg-brand flex items-center justify-center text-white shadow-sm">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
        </svg>
      </div>
      <span class="text-xl font-bold tracking-tight text-brand">Cadê Minha Garantia?</span>
    </div>
  </div>

  <main class="w-full max-w-[460px] my-auto">
    <div class="bg-white rounded-2xl border border-ink-border/80 shadow-sm p-10 text-center">
      <div class="w-16 h-16 rounded-2xl bg-danger-light text-danger flex items-center justify-center mx-auto mb-6">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-8 h-8" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
        </svg>
      </div>

      <h1 class="text-2xl font-bold text-ink tracking-tight mb-2">Não foi possível carregar esta página</h1>
      <p class="text-sm text-ink-muted mb-8 leading-relaxed">
        Ocorreu um erro inesperado ao processar sua solicitação. Tente carregar novamente ou volte à página inicial.
      </p>

      <div class="space-y-3">
        <button type="button" 
          class="w-full h-11 bg-brand hover:bg-brand-hover text-white text-sm font-semibold rounded-lg shadow-sm transition-all flex items-center justify-center gap-2 focus:outline-none focus:ring-2 focus:ring-brand focus:ring-offset-2">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
          </svg>
          Tentar novamente
        </button>

        <a href="#" 
          class="inline-flex items-center justify-center w-full h-11 bg-transparent hover:bg-canvas text-ink text-sm font-medium rounded-lg border border-ink-border transition-colors">
          Retornar ao Dashboard
        </a>
      </div>
    </div>
  </main>

  <footer class="w-full text-center py-6 text-xs text-ink-muted">
    Projeto Acadêmico • Cadê Minha Garantia?
  </footer>

</body>
</html>
