<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro de Usuário - Cadê Minha Garantia?</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              DEFAULT: '#174C3C',
              hover: '#123B2E',
              light: '#E7F1EA',
            },
            canvas: '#F7F5EF',
            ink: {
              DEFAULT: '#303832',
              muted: '#788078',
              border: '#E2E6E2',
            }
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>
</head>
<body class="bg-canvas text-ink font-sans min-h-screen flex flex-col justify-between items-center p-6 selection:bg-brand-light selection:text-brand">

  <div class="w-full flex justify-center pt-8 pb-4">
    <div class="flex items-center gap-2.5">
      <div class="w-9 h-9 rounded-lg bg-brand flex items-center justify-center text-white shadow-sm">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
        </svg>
      </div>
      <span class="text-xl font-bold tracking-tight text-brand">Cadê Minha Garantia?</span>
    </div>
  </div>

  <main class="w-full max-w-[440px] my-auto">
    <div class="bg-white rounded-2xl border border-ink-border/80 shadow-sm p-8">
      <div class="text-center mb-6">
        <h1 class="text-2xl font-bold text-ink tracking-tight">Criar uma conta</h1>
        <p class="text-sm text-ink-muted mt-1.5">Cadastre-se para gerenciar seus produtos e garantias</p>
      </div>

      <form class="space-y-4" onsubmit="event.preventDefault()">
        <div>
          <label for="name" class="block text-xs font-semibold text-ink uppercase tracking-wider mb-1.5">Nome completo</label>
          <input type="text" id="name" placeholder="Mariana Souza" 
            class="w-full h-11 px-3.5 rounded-lg border border-ink-border text-sm text-ink bg-white placeholder:text-ink-muted/60 focus:outline-none focus:ring-2 focus:ring-brand focus:border-transparent transition-all">
        </div>

        <div>
          <label for="email" class="block text-xs font-semibold text-ink uppercase tracking-wider mb-1.5">E-mail</label>
          <input type="email" id="email" placeholder="seu@email.com" 
            class="w-full h-11 px-3.5 rounded-lg border border-ink-border text-sm text-ink bg-white placeholder:text-ink-muted/60 focus:outline-none focus:ring-2 focus:ring-brand focus:border-transparent transition-all">
        </div>

        <div>
          <label for="password" class="block text-xs font-semibold text-ink uppercase tracking-wider mb-1.5">Senha</label>
          <div class="relative">
            <input type="password" id="password" placeholder="Mínimo 8 caracteres" 
              class="w-full h-11 pl-3.5 pr-10 rounded-lg border border-ink-border text-sm text-ink bg-white placeholder:text-ink-muted/60 focus:outline-none focus:ring-2 focus:ring-brand focus:border-transparent transition-all">
            <button type="button" class="absolute right-3 top-1/2 -translate-y-1/2 text-ink-muted hover:text-ink transition-colors" aria-label="Mostrar ou ocultar senha">
              <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
              </svg>
            </button>
          </div>
        </div>

        <div>
          <label for="confirm-password" class="block text-xs font-semibold text-ink uppercase tracking-wider mb-1.5">Confirmar senha</label>
          <div class="relative">
            <input type="password" id="confirm-password" placeholder="Repita a senha" 
              class="w-full h-11 pl-3.5 pr-10 rounded-lg border border-ink-border text-sm text-ink bg-white placeholder:text-ink-muted/60 focus:outline-none focus:ring-2 focus:ring-brand focus:border-transparent transition-all">
            <button type="button" class="absolute right-3 top-1/2 -translate-y-1/2 text-ink-muted hover:text-ink transition-colors" aria-label="Mostrar ou ocultar confirmação de senha">
              <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
                <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
              </svg>
            </button>
          </div>
        </div>

        <button type="submit" 
          class="w-full h-11 mt-2 bg-brand hover:bg-brand-hover text-white text-sm font-semibold rounded-lg shadow-sm transition-all flex items-center justify-center gap-2 cursor-pointer focus:outline-none focus:ring-2 focus:ring-brand focus:ring-offset-2">
          Criar conta
        </button>
      </form>

      <div class="mt-6 pt-5 border-t border-ink-border/60 text-center">
        <p class="text-sm text-ink-muted">
          Já tem uma conta? 
          <a href="#" class="font-semibold text-brand hover:underline">Entrar</a>
        </p>
      </div>
    </div>
  </main>

  <footer class="w-full text-center py-6 text-xs text-ink-muted">
    Projeto Acadêmico • Cadê Minha Garantia?
  </footer>

</body>
</html>
