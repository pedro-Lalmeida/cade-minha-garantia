<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Página não encontrada (404) - Cadê Minha Garantia?</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              DEFAULT: '#174C3C',
              hover: '#123B2E',
              light: '#E7F1EA',
            },
            canvas: '#F7F5EF',
            ink: {
              DEFAULT: '#303832',
              muted: '#788078',
              border: '#E2E6E2',
            }
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>
</head>
<body class="bg-canvas text-ink font-sans min-h-screen flex flex-col justify-between items-center p-6 selection:bg-brand-light selection:text-brand">

  <div class="w-full flex justify-center pt-8 pb-4">
    <div class="flex items-center gap-2.5">
      <div class="w-9 h-9 rounded-lg bg-brand flex items-center justify-center text-white shadow-sm">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
        </svg>
      </div>
      <span class="text-xl font-bold tracking-tight text-brand">Cadê Minha Garantia?</span>
    </div>
  </div>

  <main class="w-full max-w-[460px] my-auto">
    <div class="bg-white rounded-2xl border border-ink-border/80 shadow-sm p-10 text-center">
      <div class="w-16 h-16 rounded-2xl bg-brand-light text-brand flex items-center justify-center mx-auto mb-6">
        <span class="text-2xl font-extrabold tracking-tight">404</span>
      </div>

      <h1 class="text-2xl font-bold text-ink tracking-tight mb-2">Página não encontrada</h1>
      <p class="text-sm text-ink-muted mb-8 leading-relaxed">
        O endereço solicitado não existe ou pode ter sido movido. Verifique o link ou retorne ao painel principal.
      </p>

      <a href="#" 
        class="inline-flex items-center justify-center gap-2 w-full h-11 bg-brand hover:bg-brand-hover text-white text-sm font-semibold rounded-lg shadow-sm transition-all focus:outline-none focus:ring-2 focus:ring-brand focus:ring-offset-2">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
        </svg>
        Retornar ao Dashboard
      </a>
    </div>
  </main>

  <footer class="w-full text-center py-6 text-xs text-ink-muted">
    Projeto Acadêmico • Cadê Minha Garantia?
  </footer>

</body>
</html>
