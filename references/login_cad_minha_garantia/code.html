<!DOCTYPE html>

<html lang="pt-BR"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Cadê Minha Garantia? - Entrar</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              DEFAULT: '#174C3C',
              light: '#E7F1EA',
              dark: '#003527',
            },
            bg: '#F7F5EF',
            card: '#FFFFFF',
            txt: {
              DEFAULT: '#303832',
              muted: '#788078',
            },
            border: '#E2E8E4'
          },
          fontFamily: {
            sans: ['Manrope', 'sans-serif'],
          }
        }
      }
    }
  </script>
<style>
    body {
      background-color: #F7F5EF;
      font-family: 'Manrope', sans-serif;
    }
  </style>
</head>
<body class="min-h-screen bg-[#F7F5EF] text-[#303832] flex flex-col justify-between items-center p-4 sm:p-6 antialiased">
<!-- Espaço superior flexível -->
<div class="w-full pt-4 sm:pt-8 flex justify-center items-center">
<div class="flex items-center gap-2.5">
<div class="w-9 h-9 rounded-xl bg-[#174C3C] text-[#E7F1EA] flex items-center justify-center shadow-sm">
<span class="material-symbols-outlined text-xl">verified_user</span>
</div>
<span class="font-bold text-lg tracking-tight text-[#174C3C]">Cadê Minha Garantia?</span>
</div>
</div>
<!-- Card ShadCN Centralizado -->
<main class="w-full max-w-[420px] my-auto py-6">
<div class="bg-[#FFFFFF] rounded-2xl border border-[#E2E8E4] shadow-[0_4px_24px_-4px_rgba(23,76,60,0.06)] p-6 sm:p-8">
<!-- Cabeçalho do Card -->
<div class="text-center mb-6">
<h1 class="text-xl sm:text-2xl font-bold text-[#174C3C] tracking-tight">Entrar na sua conta</h1>
<p class="text-sm text-[#788078] mt-1.5 font-normal">Digite seus dados de acesso para continuar</p>
</div>
<!-- Formulário -->
<form class="space-y-4" id="login-form" onsubmit="handleLogin(event)">
<!-- Campo E-mail -->
<div class="space-y-1.5 text-left">
<label class="block text-xs font-semibold text-[#303832]" for="email">E-mail</label>
<input class="w-full h-11 px-3.5 rounded-lg border border-[#E2E8E4] bg-white text-[#303832] text-sm placeholder:text-[#788078]/70 focus:outline-none focus:ring-2 focus:ring-[#174C3C]/20 focus:border-[#174C3C] transition-all" id="email" name="email" placeholder="seu@email.com" required="" type="email"/>
</div>
<!-- Campo Senha -->
<div class="space-y-1.5 text-left">
<div class="flex items-center justify-between">
<label class="block text-xs font-semibold text-[#303832]" for="password">Senha</label>
<a class="text-xs text-[#174C3C] hover:underline font-medium" href="#">Esqueceu a senha?</a>
</div>
<div class="relative">
<input class="w-full h-11 pl-3.5 pr-10 rounded-lg border border-[#E2E8E4] bg-white text-[#303832] text-sm placeholder:text-[#788078]/70 focus:outline-none focus:ring-2 focus:ring-[#174C3C]/20 focus:border-[#174C3C] transition-all" id="password" name="password" placeholder="Sua senha" required="" type="password"/>
<button aria-label="Mostrar ou ocultar senha" class="absolute right-3 top-1/2 -translate-y-1/2 text-[#788078] hover:text-[#303832] transition-colors p-1" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined text-[20px]" id="password-toggle-icon">visibility</span>
</button>
</div>
</div>
<!-- Checkbox Lembrar de mim -->
<div class="flex items-center gap-2 pt-0.5">
<input class="w-4 h-4 rounded border-[#E2E8E4] text-[#174C3C] focus:ring-[#174C3C] focus:ring-offset-0 cursor-pointer" id="remember-me" type="checkbox"/>
<label class="text-xs text-[#788078] select-none cursor-pointer" for="remember-me">
            Lembrar de mim
          </label>
</div>
<!-- Botão Primário ShadCN -->
<div class="pt-2">
<button class="w-full h-11 rounded-lg bg-[#174C3C] text-white font-semibold text-sm hover:bg-[#123d30] active:scale-[0.99] transition-all flex items-center justify-center shadow-sm" id="submit-btn" type="submit">
<span class="hidden animate-spin h-4 w-4 mr-2 border-2 border-white border-t-transparent rounded-full" id="spinner"></span>
<span id="btn-text">Entrar</span>
</button>
</div>
</form>
<!-- Rodapé do Card: Link de Cadastro -->
<div class="mt-6 pt-5 border-t border-[#E2E8E4] text-center">
<p class="text-xs text-[#788078]">
          Não tem uma conta? 
          <a class="font-semibold text-[#174C3C] hover:underline ml-1" href="#">Cadastre-se</a>
</p>
</div>
</div>
</main>
<!-- Rodapé Institucional do Projeto Acadêmico -->
<footer class="w-full pb-4 sm:pb-6 text-center">
<p class="text-xs text-[#788078]/80 font-normal">
      Projeto Acadêmico • Cadê Minha Garantia?
    </p>
</footer>
<script>
    function togglePassword() {
      const passwordInput = document.getElementById('password');
      const toggleIcon = document.getElementById('password-toggle-icon');
      
      if (passwordInput.type === 'password') {
        passwordInput.type = 'text';
        toggleIcon.textContent = 'visibility_off';
      } else {
        passwordInput.type = 'password';
        toggleIcon.textContent = 'visibility';
      }
    }

    function handleLogin(e) {
      e.preventDefault();
      const spinner = document.getElementById('spinner');
      const btnText = document.getElementById('btn-text');
      const btn = document.getElementById('submit-btn');

      spinner.classList.remove('hidden');
      btnText.textContent = 'Entrando...';
      btn.disabled = true;

      setTimeout(() => {
        spinner.classList.add('hidden');
        btnText.textContent = 'Entrar';
        btn.disabled = false;
      }, 1200);
    }
  </script>
</body></html>
